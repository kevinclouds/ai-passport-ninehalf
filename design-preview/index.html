,"red","red"],"z":["龍","猴","狗","猴","虎","鼠","雞"]},{"id":"2026257","date":"09-14 21:32","openTime":"2026-09-14 21:32:32","n":["08","46","47","39","27","45","07"],"c":["red","red","blue","green","green","red","red"],"z":["豬","雞","猴","龍","龍","狗","鼠"]},{"id":"2026256","date":"09-13 21:32","openTime":"2026-09-13 21:32:32","n":["40","15","09","37","07","03","01"],"c":["red","blue","blue","blue","red","blue","red"],"z":["兔","龍","狗","馬","鼠","龍","馬"]},{"id":"2026255","date":"09-12 21:32","openTime":"2026-09-12 21:32:32","n":["36","22","06","47","39","11","44"],"c":["blue","green","green","blue","green","green","green"],"z":["羊","雞","牛","猴","龍","猴","豬"]},{"id":"2026254","date":"09-11 21:32","openTime":"2026-09-11 21:32:32","n":["26","44","35","06","16","10","02"],"c":["blue","green","red","green","green","blue","red"],"z":["蛇","豬","猴","牛","兔","雞","蛇"]},{"id":"2026253","date":"09-10 21:32","openTime":"2026-09-10 21:32:32","n":["05","35","15","28","13","49","16"],"c":["green","red","blue","green","red","green","green"],"z":["虎","猴","龍","兔","馬","馬","兔"]},{"id":"2026252","date":"09-09 21:32","openTime":"2026-09-09 21:32:32","n":["33","41","43","13","06","48","22"],"c":["green","blue","green","red","green","blue","green"],"z":["狗","虎","鼠","馬","牛","羊","雞"]},{"id":"2026251","date":"09-08 21:32","openTime":"2026-09-08 21:32:32","n":["09","06","11","25","08","45","30"],"c":["blue","green","green","blue","red","red","red"],"z":["狗","牛","猴","馬","豬","狗","牛"]},{"id":"2026250","date":"09-07 21:32","openTime":"2026-09-07 21:32:32","n":["10","06","39","47","37","17","14"],"c":["blue","green","green","blue","blue","green","blue"],"z":["雞","牛","龍","猴","馬","虎","蛇"]},{"id":"2026249","date":"09-06 21:32","openTime":"2026-09-06 21:32:32","n":["41","22","13","36","26","29","23"],"c":["blue","green","red","blue","blue","red","red"],"z":["虎","雞","馬","羊","蛇","虎","猴"]},{"id":"2026248","date":"09-05 21:32","openTime":"2026-09-05 21:32:32","n":["43","26","49","39","14","27","20"],"c":["green","blue","green","green","blue","green","blue"],"z":["鼠","蛇","馬","龍","蛇","龍","豬"]}];
let wifiMode=0,wifiIndex=-1,wifiChoice=0,wifiSelected='',wifiCurrent='家中网络',wifiNames=['家中网络','办公网络'];
let page='home',selected=-1,scrollPosition=0,settingIndex=-1,reminders=true,provisioning=false,editing=false,volume=60,brightness=80,observeView=1,observeIndex=-2,sortByMiss=true;const color={red:'#cf333c',blue:'#285cc6',green:'#187b47'};
function ball(r,i){return `<div class="ball"><div class="num" style="--wave:${color[r.c[i]]}">${r.n[i]}</div><div class="animal">${r.z[i]}</div></div>`}
function show(p){if(p==='wifi'&&page!==p){wifiMode=0;wifiIndex=-1}if(p==='settings'&&page!==p){settingIndex=-1;editing=false}page=p;render()}
// Statistics computed from the imported, deduplicated latest records.
const observationNames=['鼠','牛','虎','兔','龍','蛇','馬','羊','猴','雞','狗','豬'];
function observationRows(){const special=observeView===1,normalize=z=>({龙:'龍',马:'馬',鸡:'雞',猪:'豬'}[z]||z);const today=new Date(Date.now()+8*3600000).toISOString().slice(0,10);const firstDay=new Date(Date.parse(today+'T00:00:00Z')-6*86400000).toISOString().slice(0,10);return observationNames.map((name,index)=>{const matches=records.map(r=>(special?[r.z[6]]:r.z.slice(0,6)).some(z=>normalize(z)===name));const count=matches.filter(Boolean).length;const first=matches.indexOf(true);let streak=0;while(streak<matches.length&&matches[streak])streak++;const week=records.filter((r,i)=>matches[i]&&r.openTime.slice(0,10)>=firstDay&&r.openTime.slice(0,10)<=today).length;return {name,index,count,miss:first===-1?records.length:first,week,streak}}).sort((a,b)=>sortByMiss?b.miss-a.miss||a.index-b.index:a.week-b.week||a.index-b.index)}
function observationContent(){const special=observeView===1;return `<div class="observe-title"><strong>近30期观察</strong><span>已载入 ${records.length}期</span></div><div class="zodiac-tabs ${observeIndex===-2?'focused':''}"><span class="${special?'chosen':''}">特码生肖</span><span class="${!special?'chosen':''}">平特生肖</span></div><div class="sort-control ${observeIndex===-1?'selected':''}"><span>按${sortByMiss?'连续未出现期数降序':'近7天出现期数升序'}</span><span>OK 切换</span></div><div class="observe-list" id="observe-list">${observationRows().map((r,i)=>`<div class="zodiac-record ${observeIndex===i?'selected':''}"><div class="zodiac-summary"><strong>${r.name}</strong><span><b>${r.week}<small>期</small></b><em>近7天出现期数</em></span></div><div class="zodiac-measures"><span>近${records.length}期 <b>${r.count}次</b></span><span>连续未出现 <b>${r.count===0?'≥'+records.length:r.miss}期</b></span><span>连出 <b>${r.streak}期</b></span></div></div>`).join('')}</div><div class="foot"><span>到底再按 DOWN 回顶部</span><span>长按返回</span></div>`}
function wifiContent(){const title='<div style="position:absolute;top:36px;left:8px;font-size:20px;font-weight:600">Wi-Fi 管理</div><div style="position:absolute;top:68px;left:8px;right:12px;display:flex;justify-content:space-between;font-size:13px"><span>'+ (wifiCurrent||'未连接')+'</span><span style="color:#18753d">'+(wifiCurrent?'▂▄▆█':'')+'</span></div>';let body;if(!wifiMode)body=wifiNames.length?wifiNames.map((name,i)=>'<div style="position:absolute;top:'+(101+i*36)+'px;left:8px;right:8px;padding:9px 5px;border-radius:3px;background:'+(wifiIndex===i?'#edf2fa':'transparent')+';display:flex;justify-content:space-between;font-size:12px"><span>'+name+'</span><span style="color:#565661;font-size:10px">'+(name===wifiCurrent?'已连接':'-70 dBm')+'</span></div>').join(''):'<div style="position:absolute;top:118px;left:8px">暂无已保存网络</div>';else body='<div style="position:absolute;top:111px;left:8px;font-size:15px">'+wifiSelected+'</div>'+(wifiMode===2?'<div style="position:absolute;top:145px;left:8px;font-size:13px">删除此网络？</div>':'')+(wifiMode===2?['取消','确认删除']:['连接','删除']).map((name,i)=>'<div style="position:absolute;top:'+(175+i*40)+'px;left:8px;right:8px;padding:9px 8px;background:'+(wifiChoice===i?'#edf2fa':'transparent')+';border-radius:3px;font-size:13px">'+name+'</div>').join('');return title+body+'<div class="foot"><span>↑↓ 选择</span><span>'+(wifiMode?'OK 确认':'长按返回')+'</span></div>'}
function currentPending(){const local=new Date(Date.now()+8*3600000);return records[0].openTime.slice(0,10)<local.toISOString().slice(0,10)&&local.getUTCHours()*60+local.getUTCMinutes()>=1230}
function updateCountdown(){const label=document.getElementById('countdown-label'),value=document.getElementById('countdown-value');if(!label||!value)return;if(document.querySelector('.current-block').dataset.pending!==String(currentPending())){selected=-1;scrollPosition=0;render();return}const now=Date.now(),today=new Date(now+8*3600000).toISOString().slice(0,10);let target=Date.parse(today+'T21:30:00+08:00');if(records[0].openTime.slice(0,10)===today){target+=86400000;label.textContent='明日 21:30 揭晓'}else label.textContent='今日 21:30 揭晓';if(now>=target){value.textContent='等待揭晓';return}let seconds=Math.floor((target-now)/1000);value.textContent=[Math.floor(seconds/3600),Math.floor(seconds/60)%60,seconds%60].map(n=>String(n).padStart(2,'0')).join(':')}
setInterval(updateCountdown,1000);

function renderOne(){let r=records[0];let content='';let title='本期数字',desc='六个号码两行展示，第七个号码独立居中。状态区显示揭晓时间与下一次倒计时。';if(page==='home'){content=`<div class="records-scroll" id="records-scroll"><div class="current-block" data-pending="${currentPending()}"><div class="current-meta"><strong>本期记录</strong><span>${currentPending()?'':r.id}</span></div><div class="mini current-numbers">${[0,1,2,3,4,5,6].map(i=>currentPending()?'<div class="ball"><div class="num" style="background:#d9d9e1;outline:none"></div><div class="animal">&nbsp;</div></div>':ball(r,i)).join('')}</div><div class="today-countdown"><span id="countdown-label">今日 21:30 揭晓</span><strong id="countdown-value"></strong></div></div><div class="history-heading"><strong>往期记录</strong><span>最近 ${records.length} 期</span></div><div class="history-window" id="history-window">${records.slice(currentPending()?0:1).map((r,j)=>`<div class="row ${j===selected?'selected':j===selected-1?'before-selected':''}"><div class="row-meta"><span>${r.id}</span><span>${r.date}</span></div><div class="mini">${[0,1,2,3,4,5,6].map(i=>ball(r,i)).join('')}</div></div>`).join('')}</div></div><div class="foot"><span>到底再按 DOWN 回顶部</span><span>长按 UP 观察</span></div>`}else if(page==='observe'){content=observationContent()}else if(page==='wifi'){content=wifiContent()}else{title='设置';desc='通过手机蓝牙配网连接 2.4 GHz Wi-Fi。凭据保存在设备上，新期号只提醒一次。';content='<div class="title">设置</div><div class="setting" id="wifi-setting"><span>Wi-Fi</span><span class="status">已连接</span></div><div class="setting" id="provision"><span>重新配网</span><span>›</span></div><div class="setting" id="reminders"><span>揭晓提醒</span><span class="switch" aria-label="提醒开启"></span></div><div class="setting adjust" id="volume"><span>音量</span><span class="level" id="volume-level"></span></div><div class="setting adjust" id="brightness"><span>亮度</span><span class="level" id="brightness-level"></span></div><div class="foot"><span>↑↓ 选择</span><span>OK 确认</span></div>'}document.getElementById('screen-'+page).innerHTML='<div class="top"><span class="top-wifi"><span>'+ (wifiCurrent||'离线') +'</span><i>'+ (wifiCurrent?'▂▄▆█':'') +'</i></span><span>电量 86%</span></div>'+content;if(page==='settings'){if(settingIndex>=0)document.getElementById(['wifi-setting','provision','reminders','volume','brightness'][settingIndex]).classList.add('focused');for(let [name,value] of [['volume',volume],['brightness',brightness]])document.getElementById(name+'-level').innerHTML='<span class="level-track"><span style="width:'+value+'%"></span></span><span class="level-value">'+value+'%</span>';if(editing)document.querySelector('#screen-settings .foot').innerHTML='<span>↑↓ 调节</span><span>OK 保存</span>';let toggle=document.querySelector('.switch');toggle.classList.toggle('off',!reminders);toggle.setAttribute('aria-label',reminders?'提醒开启':'提醒关闭');if(provisioning)document.querySelector('#screen-'+page+' .foot').innerHTML='<span>等待手机配网 · 示例</span><span>Esc 返回</span>'}}
function render(){let current=page;for(let name of ['home','settings','observe','wifi']){page=name;renderOne()}page=current;updateCountdown();document.getElementById('records-scroll').scrollTop=scrollPosition;document.querySelectorAll('.preview').forEach(el=>el.classList.toggle('active',el.dataset.page===page))}
function move(d){if(page==='wifi'){if(wifiMode)wifiChoice=1-wifiChoice;else if(wifiNames.length)wifiIndex=wifiIndex<0?(d>0?0:wifiNames.length-1):(wifiIndex+d+wifiNames.length)%wifiNames.length;render();return}if(page==='observe'){observeIndex=d>0&&observeIndex===observationRows().length-1?-2:Math.max(-2,Math.min(observationRows().length-1,observeIndex+d));render();const list=document.getElementById('observe-list'),row=list.querySelector('.selected');if(observeIndex<0)list.scrollTop=0;else if(row){list.scrollTop+=row.getBoundingClientRect().top-list.getBoundingClientRect().top}return}if(page==='home'){if(d<0&&selected===-1&&scrollPosition<=0){observeIndex=-2;show('observe');return}selected=d>0&&selected===records.length-(currentPending()?1:2)?-1:Math.max(-1,Math.min(records.length-(currentPending()?1:2),selected+d));render();const area=document.getElementById('records-scroll');if(selected===-1){area.scrollTop=0;scrollPosition=0;return}const row=area.querySelector('.row.selected');if(row){const box=row.getBoundingClientRect();const view=area.getBoundingClientRect();area.scrollTop+=box.top-view.top;scrollPosition=area.scrollTop}}else{if(editing){if(settingIndex===3)volume=Math.max(0,Math.min(100,volume-d*10));else brightness=Math.max(10,Math.min(100,brightness-d*10))}else settingIndex=settingIndex<0?(d>0?0:4):(settingIndex+d+5)%5;render()}}document.addEventListener('scroll',event=>{if(event.target.id==='records-scroll')scrollPosition=event.target.scrollTop},true);
function okay(){if(page==='wifi'){if(!wifiMode){if(wifiIndex<0)return;wifiSelected=wifiNames[wifiIndex];wifiMode=1;wifiChoice=0}else if(wifiMode===1){if(wifiChoice){wifiMode=2;wifiChoice=0}else{wifiCurrent=wifiSelected;wifiMode=0}}else{if(wifiChoice){wifiNames=wifiNames.filter(n=>n!==wifiSelected);if(wifiCurrent===wifiSelected)wifiCurrent=wifiNames[0]||''}wifiMode=0;wifiIndex=-1}render();return}if(page==='observe'){if(observeIndex===-2)observeView=(observeView+1)%2;else if(observeIndex===-1)sortByMiss=!sortByMiss;render();return}if(page==='settings'){if(settingIndex<0)return;if(settingIndex===0){show('wifi');return}else if(settingIndex===2)reminders=!reminders;else if(settingIndex===1)provisioning=!provisioning;else editing=!editing;render()}else if(page==='home'){document.querySelector('#screen-'+page+' .foot').innerHTML='<span>同步完成 · 示例</span><span>已同步</span>'}}document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&e.key==='Enter')return;if(['ArrowUp','ArrowDown','Enter','Escape'].includes(e.key))e.preventDefault();if(e.key==='ArrowUp'){if(e.shiftKey&&page==='home'){observeIndex=-2;show('observe')}else move(-1)};if(e.key==='ArrowDown'){if(e.shiftKey&&page==='home')show('settings');else move(1)};if(e.key==='Enter')okay();if(e.key==='Escape'){if(page==='wifi'){if(wifiMode){wifiMode--;render()}else show('settings')}else if(page==='observe'){show('home')}else if(page==='home'){return}else if(editing){editing=false;render()}else if(provisioning){provisioning=false;render()}else show(page==='home'?'settings':'home')}});render();
</script></html>
